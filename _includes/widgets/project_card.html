<style>
    .pub-link {
        color: #98A8F8;
    }
    
    .view-all-link {
        color: #98A8F8;
    }
    
    .custom-radius {
        border-radius: 15px;
    }
    </style>
    
    
    {% assign projects = include.projects %}
    <div class="my-3 p-0 bg-white shadow-sm custom-radius">
        <h6 class="border-bottom border-gray p-3 mb-0">
            {% if include.title %}{{ include.title }}{% else %}<img src="{{ '/assets/images/cute_icons/2b50.png' | relative_url }}" alt="Star" style="height: 1.6em; width: auto; vertical-align: middle; display: inline-block;"> Selected Publications{% endif %} 
            <a href="{{ 'projects' | relative_url }}" class="pub-link">(view all <i class="fas fa-angle-double-right"></i>)</a>
        </h6>
        {% for item in projects limit:include.limit %}
            {% include widgets/publication_item.html item=item first=false last=false %}    
        {% endfor %}
        <h6 class="d-block p-3 mt-0 text-right">
            <a href="{{ 'projects' | relative_url }}" class="pub-link">All publications <i class="fas fa-angle-double-right"></i></a>
        </h6>
    </div>
